
services:
  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/app.sqlite3
      # 生产部署必须通过环境注入稳定的高强度胡椒；缺省值仅用于本地开发
      RESIDENT_PEPPER: "${RESIDENT_PEPPER:-development-pepper}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/data

volumes:
  app-data:
